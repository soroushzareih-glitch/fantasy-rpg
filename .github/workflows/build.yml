name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          cp -r /root/.local/share/godot/export_templates/. ~/.local/share/godot/export_templates/
          cp -r /root/.config/godot/. ~/.config/godot/

      - name: Find project
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -oq "$z" -d game; done
          PROJ=$(dirname "$(find . -name project.godot -not -path './.git/*' | head -1)")
          echo "PROJ=$PROJ" >> $GITHUB_ENV

      - name: Export preset
        run: |
          cat > "$PROJ/export_presets.cfg" << 'PRESET'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="0.1"
          package/unique_name="com.example.fantasyrpg"
          package/name="Fantasy RPG"
          package/signed=true
          package/classify_as_game=true
          screen/immersive_mode=true
          PRESET

      - name: Build APK
        run: |
          mkdir -p out
          cd "$PROJ"
          godot --headless --import || true
          godot --headless --export-debug "Android" "$GITHUB_WORKSPACE/out/FantasyRPG.apk"
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: FantasyRPG-apk
          path: out/FantasyRPG.apk
